services:
  db:
    image: postgres:17-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_pw
      POSTGRES_DB: portfolio
    ports:
      - "5433:5432"
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
volumes:
  portfolio_pgdata:
